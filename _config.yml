# Keep the default GitHub Pages/Jekyll branch build from following the
# platform-specific (and sometimes dangling) bin_shims symlinks.
# The canonical documentation remains generated by the MkDocs workflow.
exclude:
  - bin_shims
  - dependencies
  - Engine
  - tests
  - cmake
  - build
  - .github
  - web
  - vcpkg.json
  - CMakeLists.txt
  - main.cpp
  - Makefile
  - build_wasm.sh
